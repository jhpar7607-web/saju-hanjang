# 웹: 자동 시험 후 정적 웹을 만들어 깃허브 무료 주소에 올린다.
name: 웹 시험과 배포

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 시험과 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 자동 시험
        run: npm test
      - name: 형식 검사
        run: npm run typecheck
      - name: 정적 웹 빌드
        run: node scripts/build-static.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # 자세한 풀이 공개 설정. 저장소 Settings > Secrets and variables > Actions > Variables 에서
          # PREMIUM_OPEN 을 0 으로 만들면 잠금, 값이 없거나 1 이면 체험 공개.
          NEXT_PUBLIC_PREMIUM_OPEN: ${{ vars.PREMIUM_OPEN || '1' }}
      - name: 배포할 파일 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: 깃허브 무료 주소에 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 저장소 Settings → Pages → Source 가 'GitHub Actions' 로 되어 있어야 성공한다.
      - id: deployment
        uses: actions/deploy-pages@v4
